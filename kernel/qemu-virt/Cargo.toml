[package]
name = "krepi-qemu-virt"
version = "0.0.0"
description = "The QEMU virt board support of the krepi kernel and its default image"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The default image of QEMU virt, the only binary of the crate. It runs only
# on QEMU; on the host it is an empty program, so it has no tests.
[[bin]]
name = "krepi-qemu-virt"
path = "src/main.rs"
test = false
bench = false

[dependencies]
krepi-arch = { path = "../arch" }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
