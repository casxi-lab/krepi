[package]
name = "krepi-arch"
version = "0.0.0"
description = "The AArch64 processor layer of the krepi kernel with the ARM interrupt controller and timer that the boards share: the cold entry, the exception vectors of EL1, the processor registers that EL1 code reads, the GICv2 and the generic timer"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
