[package]
name = "krepi-arch"
version = "0.0.0"
description = "The AArch64 processor layer of the krepi kernel with the ARM interrupt controller and timer that the boards share: the cold entry, the exception vectors of EL1, the processor registers that EL1 code reads, the cache and TLB maintenance of the executing CPU, the adapter that executes the write plans of the page tables and turns the MMU on, the GICv2 and the generic timer"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
krepi-kernel = { path = "../" }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
