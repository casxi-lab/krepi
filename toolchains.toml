# Exact tool versions for each host. `cargo xtask check` reads the section of
# the host it runs on, runs each command with `--version` and fails when a
# version differs. rustc is the same in every section and equals the channel
# in rust-toolchain.toml; lld is the `rust-lld` shipped with that rustc.

[darwin-arm64]
rustc = "1.99.0"
clang = { version = "23.1.3", command = "/opt/homebrew/opt/llvm/bin/clang" }
lld = { version = "23.1.1", command = "rust-lld" }
qemu = { version = "11.1.2", command = "qemu-system-aarch64" }

[linux-aarch64]
rustc = "1.99.0"
clang = { version = "18.1.3", command = "clang-18" }
lld = { version = "23.1.1", command = "rust-lld" }
qemu = { version = "8.2.2", command = "qemu-system-aarch64" }
