# The required host checks and the QEMU boot suite on the exact candidate
# commit: the head of a pull request to main, or the commit pushed to main.
# Actions are pinned to full commit SHAs; the comment names the release.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Clang and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 qemu-system-arm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run cargo xtask check
        run: cargo xtask check --receipt artifacts/check-receipt.json

      - name: Run the QEMU boot suite
        run: cargo xtask qemu-boot --output-dir artifacts/qemu-boot

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-receipt-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          if-no-files-found: error

      - name: Upload the QEMU boot suite receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-boot-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/qemu-boot
          if-no-files-found: warn
