# Runs the proof gate on the calibration target, krepi's own target of the
# gate, in the pinned proof-tool image: once a week, on Wednesdays at 13:23
# UTC, on a manual run, and on a pull request to main that carries the
# label formal-calibration, when it is opened, reopened or updated and when
# that label is added. The job `calibration run`, the qualification job of
# the calibration, runs `cargo xtask formal check --calibration`, then
# `cargo xtask formal run --calibration --shard qualification --keep`, then
# the comparator part on the stage that it kept, as the job `formal run` of
# the workflow `formal` does, and checks that the comparator rejected the
# two challenges that it is to reject; beside it,
# the job `calibration shard <name>` runs the shard of each formal target
# of the calibration with the steps of the shard job of the workflow
# `formal`, and the job `planned example` the gate on the planned target
# of the calibration alone; after them, the job `calibration merge`
# combines the receipts of the qualification and the shards on the runner
# with `cargo xtask formal merge --calibration`. On a
# manual run that asks for it, and on a pull request with the label, the
# job `calibration mutants` runs `cargo xtask formal mutants calibration
# --calibration` and uploads the list of survivors that it writes. None of
# them is a required check; they log in to no registry, push nothing and
# use no secret. Each main command runs under `deadline.sh`, which passes a
# cancellation on to it and turns workflow commands off while it prints;
# each limit covers the deadline of its gate and the 300 s of its receipt.
# The summaries, which print text of the receipts, turn workflow commands
# off as well. The uploads hold the receipts, the summaries and the logs
# compressed, the merge its record, and the list of survivors that a
# passing run of the mutants wrote.
# Actions are pinned to full commit SHAs; the comment names the release.
name: formal calibration

on:
  schedule:
    - cron: "23 13 * * 3"
  workflow_dispatch:
    inputs:
      mutants:
        description: Also generate and run the source mutants of the calibration target
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

# `bash` runs every step with `-eo pipefail`.
defaults:
  run:
    shell: bash

env:
  # The image that verification/image-pin.json pins. The workflows step of
  # `cargo xtask check` requires every mention of the image's repository in
  # this file to be this reference.
  IMAGE: ghcr.io/casxi-lab/krepi-formal@sha256:cd3bd69b780538593e4cfe247c45145d82a0c351048bcc21882062537300f013
  # The flags of every container that runs the gate, besides the user, the
  # mount and the working directory.
  GATE_FLAGS: "--pull never --init --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --network none"
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # The deadline of the qualification job of the calibration is the gate's
  # 7,200 s and 600 s for the extraction, that of the planned example the
  # 7,200 s and the default 1,800 s of its planned target; with the 300 s of
  # the receipt, 135 and 155 minutes. Each step has two minutes more, and
  # each job 23 minutes more than its step, and the run row 40 more for the
  # comparator and its checks: 37 minutes for its step, as in the job
  # `formal run`, and 3 for the steps after it.
  calibration:
    name: ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'formal-calibration')
      && (github.event.action != 'labeled' || github.event.label.name == 'formal-calibration'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.job }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: calibration run
            key: run
            args: --shard qualification --keep
            artifact: calibration-formal-part-qualification
            deadline: 135m
            step: 137
            job: 200
          - name: planned example
            key: planned
            args: --target calibration-planned
            artifact: formal-calibration-planned
            deadline: 155m
            step: 157
            job: 180
    concurrency:
      group: formal-calibration-${{ matrix.key }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      KEY: ${{ matrix.key }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, job $KEY"
            echo "user: $(id)"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            if [ "$(id -u)" = 0 ] || [ "$(stat -c %u "$GITHUB_WORKSPACE")" != "$(id -u)" ]; then
              echo "the runner's user is root or does not own the checkout" >&2
              exit 1
            fi
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
          } 2>&1 | tee -a artifacts/formal/job.txt

      # A user other than root, a read-only root file system, no
      # capabilities and no network, as the probe of the job `formal run`.
      - name: Probe the container of the gate
        id: probe
        timeout-minutes: 1
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          docker run --rm -i "${gate_flags[@]}" --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --workdir "$GITHUB_WORKSPACE" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          [ "$(id -u)" != 0 ] || { echo "FAILED: the container runs as root"; exit 1; }
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || { echo "FAILED: capabilities"; exit 1; }
          [ "$(ls /sys/class/net)" = lo ] || { echo "FAILED: the container has a network"; exit 1; }
          "$PWD/xtask/target/debug/xtask" help > /dev/null
          echo "the probe passed"
          PROBE

      # The registry rules, the inventory and the lists of survivors of the
      # calibration; its failure fails the job, and the gate still runs. For
      # the readings of the step, the record of the job gets the bytes
      # available on the root file system before it and, where the runner
      # has it, the record of `/usr/bin/time -v`. With `time` in front, a
      # SIGTERM, at the deadline or from the runner on a cancellation, can
      # end the step before the command has ended, and no SIGKILL follows.
      - name: Check the calibration with formal check
        if: matrix.key == 'run'
        timeout-minutes: 6
        run: |
          timer=()
          if [ -x /usr/bin/time ]; then
            timer=(/usr/bin/time -v -a -o artifacts/formal/job.txt)
          else
            echo "no /usr/bin/time on the runner" >> artifacts/formal/job.txt
          fi
          { echo "== check started $(date -u +%FT%TZ)"; df -B1 /; } >> artifacts/formal/job.txt
          exec bash .github/scripts/deadline.sh --stop-commands 5m 30s "${timer[@]}" \
            bash -o pipefail -c 'xtask/target/debug/xtask formal check --calibration 2>&1 | tee artifacts/formal/check.txt'

      - name: Run the gate on the calibration in the image
        id: gate
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: ${{ matrix.step }}
        env:
          DEADLINE: ${{ matrix.deadline }}
          ARGS: ${{ matrix.args }}
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          read -r -a args <<< "$ARGS"
          exec bash .github/scripts/deadline.sh --stop-commands "$DEADLINE" 1m \
            docker run --rm --name "formal-calibration-$KEY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --calibration "${args[@]}"

      - name: Remove the container of the gate
        if: always()
        run: |
          docker rm --force "formal-calibration-$KEY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

      # The comparator part of the calibration, with the step of the job
      # `formal run` of the workflow `formal`, which a unit test keeps equal
      # to this one but for the flag --calibration. Besides its units, it
      # judges the two challenges that the comparator is to reject.
      - name: Run the comparator in its own container
        id: comparator
        if: ${{ !cancelled() && matrix.key == 'run' && steps.probe.outcome == 'success' }}
        timeout-minutes: 37
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          relaxed=(--security-opt seccomp=unconfined --security-opt apparmor=unconfined
            --tmpfs /run/user --security-opt systempaths=unconfined)
          printf '[safe]\n\tdirectory = *\n' > "$RUNNER_TEMP/gitconfig"
          mkdir -p artifacts/formal/runs
          echo "== probe: docker run $GATE_FLAGS ${relaxed[*]} --user $(id -u):$(id -g)" \
            | tee -a artifacts/formal/job.txt
          docker run --rm -i "${gate_flags[@]}" "${relaxed[@]}" --user "$(id -u):$(id -g)" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          status=0
          fail() { echo "FAILED: $*"; status=1; }
          echo "user: $(id)"
          [ "$(id -u)" != 0 ] || fail "the container runs as root"
          root=$(awk '$2 == "/" { line = $0 } END { print line }' /proc/self/mounts)
          echo "root file system: $root"
          case ",$(echo "$root" | awk '{ print $4 }')," in
            *,ro,*) ;;
            *) fail "the root file system is not read-only" ;;
          esac
          grep -E '^(CapBnd|CapEff|NoNewPrivs):' /proc/self/status
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || fail "capabilities are left"
          grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/self/status || fail "new privileges are allowed"
          echo "network interfaces: $(ls /sys/class/net)"
          [ "$(ls /sys/class/net)" = lo ] || fail "the container has a network"
          exit "$status"
          PROBE
          echo "== comparator started $(date -u +%FT%TZ)" | tee -a artifacts/formal/job.txt
          exec bash .github/scripts/deadline.sh --stop-commands 35m 1m \
            docker run --rm --name "formal-comparator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" "${relaxed[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/artifacts/formal/runs:/krepi-runs" --env KREPI_FORMAL_RUNS=/krepi-runs \
            --volume "$RUNNER_TEMP/gitconfig:/etc/gitconfig:ro" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --calibration --shard comparator

      - name: Remove the container of the comparator
        if: ${{ always() && matrix.key == 'run' }}
        timeout-minutes: 1
        run: |
          if docker rm --force "formal-comparator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1; then
            echo "removed the container of the comparator"
          else
            echo "no container of the comparator is left"
          fi

      # The two challenges that the comparator part of the calibration
      # judges beside its units and never concludes: the first statement's
      # theorem with the second statement, and the first theorem with the
      # permitted axioms of its unit but propext, which it uses. The step
      # fails unless the comparator rejected each, with Lake's message for
      # it in the error log of its command, and verified the unit of the
      # calibration target, so that the second differs from a verified
      # challenge only by the axiom left out.
      - name: Check that the comparator rejects the fixed challenges
        if: ${{ !cancelled() && matrix.key == 'run' }}
        timeout-minutes: 1
        run: |
          # The receipt and the logs hold text of Lean and Lake: no workflow
          # commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          shopt -s nullglob
          receipts=()
          for receipt in artifacts/formal/runs/*/receipt.json; do
            if jq -e '.shard == "comparator"' "$receipt" > /dev/null; then
              receipts+=("$receipt")
            fi
          done
          {
            echo "## formal calibration: the challenges that the comparator rejects"
            echo
            if [ "${#receipts[@]}" != 1 ]; then
              echo "- FAILED: the comparator left ${#receipts[@]} receipts, not one"
              exit 1
            fi
            receipt=${receipts[0]}
            status=0
            fail() { echo "- FAILED: $*"; status=1; }
            verified=$(jq -r '.units["comparator/calibration"].status // "none"' "$receipt")
            echo "- \`comparator/calibration\`: $verified"
            [ "$verified" = VERIFIED ] || fail "the unit comparator/calibration is not VERIFIED"
            units=$(jq -c '[.commands[] | .unit // "" | select(startswith("comparator-negative/"))] | sort' "$receipt")
            [ "$units" = '["comparator-negative/axiom","comparator-negative/statement"]' ] \
              || fail "the challenges ran as the commands of $units"
            for expected in "statement:Challenge and solution theorem statement do not match" \
                "axiom:Illegal axiom detected: 'propext'"; do
              unit=comparator-negative/${expected%%:*}
              message=${expected#*:}
              class=$(jq -r --arg unit "$unit" \
                'first(.commands[] | select(.unit == $unit) | .class) // "none"' "$receipt")
              log=$(jq -r --arg unit "$unit" \
                'first(.commands[] | select(.unit == $unit) | .stderr.path) // empty' "$receipt")
              echo "- \`$unit\`: $class"
              [ "$class" = PROOF_FAILURE ] || fail "$unit is $class, not PROOF_FAILURE"
              if [ -n "$log" ] && line=$(grep -F -m 1 -- "$message" "$(dirname "$receipt")/$log"); then
                echo "    $line"
              else
                fail "the error log of $unit does not hold: $message"
              fi
            done
            exit "$status"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize the receipt and compress the logs
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          shopt -s nullglob
          # The receipts hold text of Lean and Lake: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          logs=()
          for file in artifacts/formal/job.txt artifacts/formal/check.txt artifacts/formal/runs/*/logs; do
            if [ -e "$file" ]; then logs+=("$file"); fi
          done
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          receipts=(artifacts/formal/runs/*/receipt.json)
          {
            echo "## formal calibration: $KEY"
            echo
            echo "Image \`$IMAGE\`; the gate step: $GATE_OUTCOME."
            echo
            for receipt in "${receipts[@]}"; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, complete \(.complete), \(.seconds) s",
                "- Phases: " + ([.phases | to_entries[] | "\(.key) \(.value.seconds) s"] | join(", ")),
                "- Units: " + ([.units[].status] | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                (.proof_targets | to_entries[] | "- Target `\(.key)`: budget \(.value.budget_seconds) s, \(.value.seconds) s"),
                (.units | to_entries[] | select(.value.status != "VERIFIED") | "- `\(.key)`: \(.value.status)"),
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
          } | tee artifacts/formal/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#receipts[@]}" = 0 ] && [[ "$GATE_OUTCOME" =~ ^(success|failure)$ ]]; then
            echo "the gate step ran and left no receipt" >&2
            exit 1
          fi

      - name: Upload the receipt, the summary and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # The shard of each formal target of the calibration, beside the
  # qualification job, with the steps of the shard job of the workflow
  # `formal`, which a unit test keeps equal to these but for the flag
  # --calibration and the prefix of the artifact: its deadline is 300 s
  # and the budget of the target, then the 300 s of its receipt, 60 minutes
  # for the 3,000 s of `calibration`; the step has two minutes more, and the
  # job 15 minutes before the step and 3 after it. A unit test keeps the
  # matrix equal to the formal targets of the calibration registry.
  shard:
    name: calibration shard ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'formal-calibration')
      && (github.event.action != 'labeled' || github.event.label.name == 'formal-calibration'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.job }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: calibration
            budget: 3000
            step: 62
            job: 80
    concurrency:
      group: formal-calibration-shard-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NAME: ${{ matrix.name }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, shard target/$NAME"
            echo "user: $(id)"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            if [ "$(id -u)" = 0 ] || [ "$(stat -c %u "$GITHUB_WORKSPACE")" != "$(id -u)" ]; then
              echo "the runner's user is root or does not own the checkout" >&2
              exit 1
            fi
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
            df -B1 /
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
          } 2>&1 | tee -a artifacts/formal/job.txt

      # The probe of the job `formal planned` of the workflow `formal`.
      - name: Probe the container of the gate
        id: probe
        timeout-minutes: 1
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          docker run --rm -i "${gate_flags[@]}" --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --workdir "$GITHUB_WORKSPACE" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          [ "$(id -u)" != 0 ] || { echo "FAILED: the container runs as root"; exit 1; }
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || { echo "FAILED: capabilities"; exit 1; }
          [ "$(ls /sys/class/net)" = lo ] || { echo "FAILED: the container has a network"; exit 1; }
          "$PWD/xtask/target/debug/xtask" help > /dev/null
          echo "the probe passed"
          PROBE

      # The step ends two minutes after the deadline of the shard and its
      # receipt, from the matrix; `deadline.sh` stops the command at that
      # deadline and kills it a minute later.
      - name: Run the shard in the image
        id: shard
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          limit=$(( (STEP - 2) * 60 ))s
          exec bash .github/scripts/deadline.sh --stop-commands "$limit" 1m \
            docker run --rm --name "formal-shard-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --calibration --shard "target/$NAME"

      - name: Remove the container of the gate
        if: always()
        run: |
          docker rm --force "formal-shard-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

      - name: Summarize the receipt and compress the logs
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.shard.outcome }}
        run: |
          shopt -s nullglob
          # The receipts hold text of Lean and Lake: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          mkdir -p artifacts/formal
          logs=(artifacts/formal/runs/*/logs)
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          receipts=(artifacts/formal/runs/*/receipt.json)
          {
            echo "## formal shard $NAME"
            echo
            echo "Image \`$IMAGE\`; the shard step: $GATE_OUTCOME."
            echo
            for receipt in "${receipts[@]}"; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, complete \(.complete), \(.seconds) s",
                "- Phases: " + ([.phases | to_entries[] | "\(.key) \(.value.seconds) s"] | join(", ")),
                "- Units: " + ([.units[].status] | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                (.proof_targets | to_entries[] | "- Target `\(.key)`: budget \(.value.budget_seconds) s, \(.value.seconds) s"),
                "- Resources: disk available at the start \(.resources.disk_available_at_start) B, " +
                  "least \(.resources.disk_least_available) B; largest process " +
                  "\(.resources.largest_process_max_rss) B; cgroup memory peak " +
                  "\(.resources.cgroup_memory_peak) B",
                (.units | to_entries[] | select(.value.status != "VERIFIED") | "- `\(.key)`: \(.value.status)"),
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
          } | tee artifacts/formal/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#receipts[@]}" = 0 ] && [[ "$GATE_OUTCOME" =~ ^(success|failure)$ ]]; then
            echo "the shard step ran and left no receipt" >&2
            exit 1
          fi

      - name: Upload the receipt, the summary and the logs of the shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-formal-part-target-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/job.txt
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # Merges the receipts of the qualification job and of the shards of the
  # calibration on the runner with `cargo xtask formal merge --calibration`,
  # with the steps of the merge job of the workflow `formal`, which a unit
  # test keeps equal to these but for the flag --calibration and the
  # prefixes of the artifacts. It runs when the jobs above ran, unless the
  # run was cancelled.
  merge:
    name: calibration merge
    needs: [calibration, shard]
    if: ${{ !cancelled() && needs.calibration.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: formal-calibration-merge-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # The start of the runner's worker process, else that of this step.
      - name: Record the start of the job
        timeout-minutes: 1
        run: |
          start=$(date +%s)
          if worker=$(ps -o etimes= -C Runner.Worker | sort -n | tail -n 1 | tr -d ' ') \
              && [ -n "$worker" ]; then
            start=$(( start - worker ))
          fi
          echo "KREPI_FORMAL_MERGE_STARTED=$start" | tee -a "$GITHUB_ENV"

      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build xtask
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/formal
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
            echo "== before the download $(date -u +%FT%TZ)"
            df -B1 /
            free -b
          } 2>&1 | tee artifacts/formal/job.txt

      # A single artifact goes to the path itself; of several, each goes to a
      # directory of its own, named after it.
      - name: Download the parts of the run
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: calibration-formal-part-*-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: artifacts/formal/parts

      # Every receipt of the parts, however the artifacts are laid out; the
      # record of the job gets that of `/usr/bin/time -v`, where the runner
      # has it. With `time` in front, a SIGTERM, at the deadline or from the
      # runner on a cancellation, can end the step before the command has
      # ended, and no SIGKILL follows.
      - name: Merge the receipts of the parts
        id: merge
        timeout-minutes: 3
        run: |
          receipts=()
          while IFS= read -r -d '' receipt; do
            receipts+=("$receipt")
          done < <(find artifacts/formal/parts -name receipt.json -print0 | sort -z)
          if [ "${#receipts[@]}" = 0 ]; then
            echo "no part of this run left a receipt" >&2
            exit 1
          fi
          timer=()
          if [ -x /usr/bin/time ]; then
            timer=(/usr/bin/time -v -a -o artifacts/formal/job.txt)
          else
            echo "no /usr/bin/time on the runner" >> artifacts/formal/job.txt
          fi
          exec bash .github/scripts/deadline.sh --stop-commands 2m 30s "${timer[@]}" \
            xtask/target/debug/xtask formal merge --calibration "${receipts[@]}"

      - name: Summarize the merge
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          mkdir -p artifacts/formal
          { echo "== after the merge $(date -u +%FT%TZ)"; df -B1 /; free -b; } >> artifacts/formal/job.txt
          # The record holds text of the receipts: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          record=artifacts/formal/merge/record.json
          {
            echo "## formal merge"
            echo
            echo "The merge step: $MERGE_OUTCOME."
            echo
            if [ -f "$record" ]; then
              cat artifacts/formal/merge/summary.md
              jq -r '(.parts[] | "- Part `\(.shard // "none")`, attempt \(.attempt // "none")" +
                  "\(if .superseded then ", superseded" else "" end): \(.status // "unread"), " +
                  "\(.seconds) s, SHA-256 `\(.sha256 // "none")`"),
                "- Merge: \(.merge_seconds) s from the \(.merge_from)"' "$record"
            else
              echo "The merge left no record."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the merge record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-calibration-merge-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/job.txt
            artifacts/formal/merge/record.json
            artifacts/formal/merge/summary.md
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # The run of `formal mutants` has a budget of 14,400 s; with the 300 s of
  # its receipt, 245 minutes, its step two more and its job 20 more.
  mutants:
    name: calibration mutants
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mutants)
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'formal-calibration')
      && (github.event.action != 'labeled' || github.event.label.name == 'formal-calibration'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 267
    permissions:
      contents: read
    concurrency:
      group: formal-calibration-mutants-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, job mutants"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            if [ "$(id -u)" = 0 ] || [ "$(stat -c %u "$GITHUB_WORKSPACE")" != "$(id -u)" ]; then
              echo "the runner's user is root or does not own the checkout" >&2
              exit 1
            fi
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
          } 2>&1 | tee -a artifacts/formal/job.txt

      - name: Run the source mutants of the calibration in the image
        id: mutants
        timeout-minutes: 247
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          exec bash .github/scripts/deadline.sh --stop-commands 245m 1m \
            docker run --rm --name "formal-calibration-mutants-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal mutants calibration --calibration

      - name: Remove the container of the run
        if: always()
        run: |
          docker rm --force "formal-calibration-mutants-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

      - name: Summarize the list of survivors and compress the logs
        if: always()
        env:
          OUTCOME: ${{ steps.mutants.outcome }}
        run: |
          shopt -s nullglob
          # The receipts hold text of Lean and Lake: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          logs=()
          for file in artifacts/formal/job.txt artifacts/formal/runs/*/logs; do
            if [ -e "$file" ]; then logs+=("$file"); fi
          done
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          # A run that fails writes no list, and the checkout may hold one
          # of an earlier run, so only that of a passing run is read.
          written=verification/qualification/calibration/mutants/calibration.json
          list=artifacts/formal/mutants/calibration.json
          if [ "$OUTCOME" = success ] && [ -f "$written" ]; then
            mkdir -p artifacts/formal/mutants
            cp "$written" "$list"
          fi
          {
            echo "## formal calibration: mutants"
            echo
            echo "The run step: $OUTCOME."
            echo
            for receipt in artifacts/formal/runs/*/receipt.json; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, \(.seconds) s",
                (.units | to_entries[] | select(.value.status != "VERIFIED") | "- `\(.key)`: \(.value.status)"),
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
            if [ -f "$list" ]; then
              jq -r '"- List: \(.generated) generated, \(.killed) killed, \(.survivors | length) survived, \(.unbuildable) do not build, \(.not_unique) without a text that occurs once"' "$list"
            else
              echo "- No list of survivors from this run"
            fi
          } | tee artifacts/formal/summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the list of survivors, the receipt and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-calibration-mutants-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/mutants/calibration.json
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
