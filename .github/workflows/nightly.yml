# The nightly line: once a day at 10:43 UTC, and on a manual run, on main
# only. It runs the host checks with the slow tests, and every QEMU suite
# with its slow cases on the images taken by their digests. Each job has a
# limit, and the check, the image command and the suite command also stop
# at a deadline two minutes before the limit of their job; the script that
# sets the deadline passes a stop signal of the runner on to the command
# and waits for it. Actions are pinned to full commit SHAs; the comment
# names the release.
name: nightly

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.sha }}
  cancel-in-progress: false

# The jobs restore the caches that the workflow cache saves from main, and
# save none.
cache-mode: read

# `bash` runs every step with `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: nightly cargo xtask check --slow
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      # apt, which runs as root, leaves a lock and a partial directory that
      # the runner user cannot read beside the packages; they are removed,
      # so that the tools cache holds the packages alone, owned by the
      # runner user.
      - name: Install Clang and QEMU
        run: |
          mkdir -p ~/.cache/krepi-ci/apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.cache/krepi-ci/apt" \
            -o APT::Keep-Downloaded-Packages=true clang-18 qemu-system-arm
          sudo rm -rf ~/.cache/krepi-ci/apt/partial ~/.cache/krepi-ci/apt/lock
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/krepi-ci/apt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run cargo xtask check with the slow tests
        run: exec bash .github/scripts/deadline.sh 38m 90s cargo xtask check --slow --receipt artifacts/check-receipt.json

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-check-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  image:
    name: nightly image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact: nightly-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      test-elf-sha256: ${{ steps.image.outputs.test-elf-sha256 }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Write the images
        run: exec bash .github/scripts/deadline.sh 3m 60s cargo xtask image --output-dir artifacts/images

      - name: Give the digests of the images as outputs
        id: image
        run: jq -r '.images[] | "\(.name)-sha256=\(.sha256)"' artifacts/images/images.json >> "$GITHUB_OUTPUT"

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/images
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  suite:
    name: nightly suite --slow
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      # apt, which runs as root, leaves a lock and a partial directory that
      # the runner user cannot read beside the packages; they are removed,
      # so that the tools cache holds the packages alone, owned by the
      # runner user.
      - name: Install QEMU
        run: |
          mkdir -p ~/.cache/krepi-ci/apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.cache/krepi-ci/apt" \
            -o APT::Keep-Downloaded-Packages=true qemu-system-arm
          sudo rm -rf ~/.cache/krepi-ci/apt/partial ~/.cache/krepi-ci/apt/lock
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/krepi-ci/apt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # The name of the artifact comes from the job that uploaded it, so
      # that a rerun of this job alone still finds it.
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.image.outputs.artifact }}
          path: artifacts/images

      # Workflow commands are off while the suite prints.
      - name: Run every QEMU suite with the slow cases
        env:
          TEST_ELF_SHA256: ${{ needs.image.outputs.test-elf-sha256 }}
        run: |
          exec bash .github/scripts/deadline.sh --stop-commands 23m 60s cargo xtask suite --slow \
            --images artifacts/images --expect "test-elf=$TEST_ELF_SHA256" --output-dir artifacts/suite

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-suite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/suite
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
