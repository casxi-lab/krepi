# The proof gate in CI, in parts of one commit, and its verdicts. On every
# event of a pull request to main, the job `formal fast` lists the paths
# that the pull request changes since its merge base, whether they affect
# the gate and the registered targets that they affect, and the job
# `formal guard` runs `cargo xtask formal guard`, both on the runner. The
# gate runs when the label full-check is added to a pull request whose
# change affects it, on a manual run of main, `full` or `weekly`, and on the
# weekly schedule, on Tuesdays at 12:37 UTC. Then the job `formal limits`
# computes the shards and their limits from the budgets of the registry;
# the job `formal run`, the qualification job, runs `cargo xtask formal run
# --shard qualification --keep` in the pinned proof-tool image and then the
# comparator part on the stage that it kept; beside it, the job `formal
# shard <name>` runs the shard of each formal target of the head's
# registry, and the job `formal scoped <name>` each planned target that the
# pull request affects, alone; after them, the job `formal parts` merges
# the receipts of the parts on the runner. The jobs `formal merge`, `formal
# axioms`, `formal leanchecker` and `formal comparator` judge its record,
# the conclusion of the gate and each hard gate, on the events above and
# fail on any other; with `formal fast` and `formal guard`, they are the
# six checks of the gate, which run on every event of a pull request, are
# skipped only on main and fail on an event or a ref that they do not
# judge. On a push to main, which is the merge of a pull request, the job
# `formal receipt review` reviews the merge record of the merged head. The
# measurement jobs are in the workflow `formal measure`,
# `formal-measure.yml`.
# Actions are pinned to full commit SHAs; the comment names the release.
name: formal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: The run of the gate, full or weekly
        type: choice
        options: [full, weekly]
        required: true
  schedule:
    - cron: "37 12 * * 2"

# The runs of a pull request share a group, and a newer run cancels an
# older one with all its jobs, also those that wait for others, so that no
# older run concludes after a newer event; any other run has a group of its
# own. A re-run keeps the event of its run, so the first step of each of
# the six checks fails a re-run of a run that is not the newest of the
# pull request's head, which it asks with the token of the run.
concurrency:
  group: formal-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `bash` runs every step with `-eo pipefail`, so that a failed command in a
# pipeline, such as `docker run ... | tee`, fails its step.
defaults:
  run:
    shell: bash

env:
  # The image that verification/image-pin.json pins. The workflows step of
  # `cargo xtask check` requires every mention of the image's repository in
  # this file to be this reference.
  IMAGE: ghcr.io/casxi-lab/krepi-formal@sha256:cd3bd69b780538593e4cfe247c45145d82a0c351048bcc21882062537300f013
  # The flags of every container that runs the gate or its tools, besides
  # the user, which is the runner's own, the mount and the working directory.
  GATE_FLAGS: "--pull never --init --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --network none"
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The trigger of the run, which the parts of the gate record: REQUIRED on
  # a pull request, FORCED_FULL on a manual run `full`, and WEEKLY on a
  # manual run `weekly` and on the schedule.
  KREPI_FORMAL_TRIGGER: ${{ github.event_name == 'pull_request' && 'REQUIRED' || github.event_name == 'schedule' && 'WEEKLY' || github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && 'FORCED_FULL' || github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly' && 'WEEKLY' || '' }}

jobs:
  # Runs the gate: when the label full-check is added to a pull request
  # whose change affects the gate, by the decision of `formal fast`, and on
  # a manual or scheduled run of main. The deadline of the shard of a
  # target, and of a planned target that the pull request affects, which
  # runs alone, is 300 s and the budget of the target; then each has the
  # 300 s of its receipt. Its step has the minutes of its deadline and
  # receipt, rounded up, and two more, as `deadline.sh` kills its command a
  # minute after its deadline; its job 15 minutes before the step, the step
  # and 3 minutes after it. Every formal target is a shard of its own, named
  # by its unit, whose registered budget per worker may be at most the
  # shard limit, 3,300 s, as `cargo xtask formal check` requires; a job of
  # the hosted runners ends after 360 minutes. Target names are checked
  # before they are passed on. The limits of the qualification job do not
  # depend on the registry and are written in it.
  limits:
    name: formal limits
    needs: fast
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'full-check' && needs.fast.result == 'success' && needs.fast.outputs.decision == 'affected') || (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.limits.outputs.shards }}
      scoped: ${{ steps.limits.outputs.scoped }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compute the limits from the registered budgets
        id: limits
        timeout-minutes: 1
        env:
          SCOPED: ${{ needs.fast.outputs.scoped || '[]' }}
        run: |
          shard_margin=300
          receipt_margin=300
          shard_limit=3300
          workers=1
          registry=verification/targets.json
          jq -e 'all(.targets[]; .name | test("^[a-z0-9][a-z0-9-]*$"))' "$registry" > /dev/null
          # The targets of the state $1 with a name of the list $2, or with
          # any name when it is null, grouped by their name with the sum of
          # their budgets, and the limits of the step and the job of each.
          rows() {
            jq -c --argjson margin "$((shard_margin + receipt_margin))" --arg state "$1" --argjson names "$2" '
              [.targets[] | select((.state // "formal") == $state and ($names == null or (.name | IN($names[]))))
                | {name, budget: (.budget // 1800)}]
              | group_by(.name) | map({name: .[0].name, budget: (map(.budget) | add)})
              | map(.step = ((.budget + $margin + 59) / 60 | floor) + 2 | .job = 15 + .step + 3)' \
              "$registry"
          }
          # One shard for each formal target, and one job for each planned
          # target that the pull request affects, which runs it alone.
          shards=$(rows formal null)
          scoped=$(rows planned "$SCOPED")
          over=$(jq -r --argjson limit "$shard_limit" --argjson workers "$workers" \
            '[.[] | select((.budget + $workers - 1) / $workers | floor > $limit) | .name] | join(" ")' <<< "$shards")
          if [ -n "$over" ]; then
            echo "the registered budget per worker of the shard of $over is more than $shard_limit s" >&2
            exit 1
          fi
          long=$(jq -r '[.[] | select(.job > 360) | .name] | join(" ")' <<< "$scoped")
          if [ -n "$long" ]; then
            echo "the registered budget of $long needs a job longer than 360 minutes" >&2
            exit 1
          fi
          {
            echo "shards=$shards"
            echo "scoped=$scoped"
          } | tee -a "$GITHUB_OUTPUT"

  # The qualification job: `cargo xtask formal run --shard qualification
  # --keep` (the guard phase, the qualification, the extraction of every
  # formal target and the base round), which keeps the stage of its base
  # round, and then the comparator part, `cargo xtask formal run --shard
  # comparator`, on that stage in a container of its own; each receipt is
  # one part of the merge. The deadline of the gate is its 7,200 s and 600 s
  # for the extraction of every formal target, that of the comparator its
  # 1,800 s; then each has the 300 s of its receipt. Each step has the
  # minutes of its deadline and receipt and two more, as `deadline.sh` kills
  # its command a minute after its deadline, and the job 15 minutes before
  # the gate step, the two steps and 3 minutes after them.
  gate:
    name: formal run
    needs: limits
    if: ${{ !cancelled() && needs.limits.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 192
    permissions:
      contents: read
    steps:
      - name: Check out the candidate commit with its history
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT"
            echo "user: $(id)"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            uname -srvm
            docker info --format 'Docker {{.ServerVersion}}, cgroup version {{.CgroupVersion}}'
            docker info --format 'security options {{json .SecurityOptions}}'
            if [ "$(id -u)" = 0 ]; then
              echo "the runner's user is root; the gate is to run as another user" >&2
              exit 1
            fi
            owner=$(stat -c %u "$GITHUB_WORKSPACE")
            if [ "$owner" != "$(id -u)" ]; then
              echo "the checkout belongs to user $owner, not to the runner's user" >&2
              exit 1
            fi
            echo "the checkout belongs to the runner's user"
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
            df -B1 /
            cp "$GITHUB_EVENT_PATH" artifacts/formal/event.json
            echo "the event is copied to artifacts/formal/event.json"
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
            ls -l xtask/target/debug/xtask
          } 2>&1 | tee -a artifacts/formal/job.txt

      # The comparator part runs this copy of xtask, mounted read-only: the
      # gate, whose container mounts only the checkout, cannot change it.
      - name: Copy xtask for the comparator
        timeout-minutes: 1
        run: |
          cp xtask/target/debug/xtask "$RUNNER_TEMP/xtask"
          sha256sum "$RUNNER_TEMP/xtask" | tee -a artifacts/formal/job.txt

      # The probe fails unless the container runs as a user other than root,
      # on a read-only root file system, without capabilities, new privileges
      # or a network, and unless every attempt to write or re-mode the
      # installation fails; it also starts xtask in the image.
      - name: Probe the container of the gate
        id: probe
        timeout-minutes: 1
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          echo "== probe: docker run $GATE_FLAGS --user $(id -u):$(id -g)" \
            | tee -a artifacts/formal/job.txt
          docker run --rm -i "${gate_flags[@]}" --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --workdir "$GITHUB_WORKSPACE" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          status=0
          fail() { echo "FAILED: $*"; status=1; }
          echo "user: $(id)"
          [ "$(id -u)" != 0 ] || fail "the container runs as root"
          root=$(awk '$2 == "/" { line = $0 } END { print line }' /proc/self/mounts)
          echo "root file system: $root"
          case ",$(echo "$root" | awk '{ print $4 }')," in
            *,ro,*) ;;
            *) fail "the root file system is not read-only" ;;
          esac
          grep -E '^(CapBnd|CapEff|NoNewPrivs):' /proc/self/status
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || fail "capabilities are left"
          grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/self/status || fail "new privileges are allowed"
          echo "network interfaces: $(ls /sys/class/net)"
          [ "$(ls /sys/class/net)" = lo ] || fail "the container has a network"
          echo "process 1: $(cat /proc/1/comm)"
          for dir in lean backend bin rustup cargo; do
            path=/opt/krepi-formal/$dir
            if touch "$path/.probe" 2>&1; then
              fail "created $path/.probe"
            fi
            if chmod u+w "$path" 2>&1; then
              fail "changed the mode of $path"
            fi
          done
          if "$PWD/xtask/target/debug/xtask" help > /dev/null; then
            echo "xtask starts in the image"
          else
            fail "xtask does not start in the image"
          fi
          exit "$status"
          PROBE
          echo "== the probe passed; prepare ended $(date -u +%FT%TZ)" \
            | tee -a artifacts/formal/job.txt

      # The gate ends by its own deadline; `deadline.sh` stops it at that
      # deadline and its receipt and kills it a minute later, a minute before
      # the step's limit, and turns workflow commands off while it prints.
      # The receipt is the gate's verdict, so the step fails whenever the gate
      # does, `REJECTED` included.
      - name: Run the gate in the image
        id: gate
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: 137
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          echo "== gate started $(date -u +%FT%TZ)" | tee -a artifacts/formal/job.txt
          exec bash .github/scripts/deadline.sh --stop-commands 135m 1m \
            docker run --rm --name "formal-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_EVENT_NAME --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_TRIGGER \
            --env GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/artifacts/formal/event.json" \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --shard qualification --keep

      - name: Remove the container of the gate
        if: always()
        run: |
          if docker rm --force "formal-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1; then
            echo "removed the container of the gate"
          else
            echo "no container of the gate is left"
          fi

      # The comparator part on the stage that the gate kept, also when the
      # gate failed: `lake comparator` runs in a sandbox of bubblewrap, which
      # needs unprivileged user namespaces on the runner and, in the
      # container, seccomp and AppArmor unconfined, an empty /run/user and
      # the system paths unmasked. The container keeps the other flags of the
      # gate, which a probe checks first. The sandbox sees the stage through
      # a second mount of the runs directory outside /home, which
      # KREPI_FORMAL_RUNS names; it clears the environment, so Git there
      # reads only /etc/gitconfig, which marks the packages of the image,
      # which belong to root, as safe. The part runs the copy of xtask that
      # the job made before the gate, at /krepi-xtask. `deadline.sh` stops
      # the part at the deadline of the part and its receipt and kills it a
      # minute later.
      - name: Run the comparator in its own container
        id: comparator
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: 37
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          relaxed=(--security-opt seccomp=unconfined --security-opt apparmor=unconfined
            --tmpfs /run/user --security-opt systempaths=unconfined)
          printf '[safe]\n\tdirectory = *\n' > "$RUNNER_TEMP/gitconfig"
          mkdir -p artifacts/formal/runs
          echo "== probe: docker run $GATE_FLAGS ${relaxed[*]} --user $(id -u):$(id -g)" \
            | tee -a artifacts/formal/job.txt
          docker run --rm -i "${gate_flags[@]}" "${relaxed[@]}" --user "$(id -u):$(id -g)" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          status=0
          fail() { echo "FAILED: $*"; status=1; }
          echo "user: $(id)"
          [ "$(id -u)" != 0 ] || fail "the container runs as root"
          root=$(awk '$2 == "/" { line = $0 } END { print line }' /proc/self/mounts)
          echo "root file system: $root"
          case ",$(echo "$root" | awk '{ print $4 }')," in
            *,ro,*) ;;
            *) fail "the root file system is not read-only" ;;
          esac
          grep -E '^(CapBnd|CapEff|NoNewPrivs):' /proc/self/status
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || fail "capabilities are left"
          grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/self/status || fail "new privileges are allowed"
          echo "network interfaces: $(ls /sys/class/net)"
          [ "$(ls /sys/class/net)" = lo ] || fail "the container has a network"
          exit "$status"
          PROBE
          echo "== comparator started $(date -u +%FT%TZ)" | tee -a artifacts/formal/job.txt
          exec bash .github/scripts/deadline.sh --stop-commands 35m 1m \
            docker run --rm --name "formal-comparator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" "${relaxed[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/artifacts/formal/runs:/krepi-runs" --env KREPI_FORMAL_RUNS=/krepi-runs \
            --volume "$RUNNER_TEMP/gitconfig:/etc/gitconfig:ro" \
            --volume "$RUNNER_TEMP/xtask:/krepi-xtask:ro" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env KREPI_FORMAL_TRIGGER \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" /krepi-xtask formal run --shard comparator

      - name: Remove the container of the comparator
        if: always()
        timeout-minutes: 1
        run: |
          if docker rm --force "formal-comparator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1; then
            echo "removed the container of the comparator"
          else
            echo "no container of the comparator is left"
          fi

      - name: Summarize the receipt
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          shopt -s nullglob
          # The receipt holds text of Lean, Lake and the registries of the
          # head: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          receipts=(artifacts/formal/runs/*/receipt.json)
          {
            echo "## formal run"
            echo
            echo "Image \`$IMAGE\`; the gate step: $GATE_OUTCOME."
            echo
            if [ "${#receipts[@]}" = 0 ]; then
              echo "The gate left no receipt."
            fi
            for receipt in "${receipts[@]}"; do
              jq -r --arg path "$receipt" '
                "- Receipt `\($path)`: `\(.status)`, complete \(.complete), \(.seconds) s",
                "- Phases: " + ([.phases | to_entries[] | "\(.key) \(.value.seconds) s"] | join(", ")),
                "- Units: " + ([.units[].status] | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                "- Image: " + (.image | if . == null then "none" else
                  "`\(.reference)`, user \(.uid), writable \(.writable), " +
                  "versions.json SHA-256 `\(.versions_sha256)`" end),
                "- Resources: disk available at the start \(.resources.disk_available_at_start) B, " +
                  "least \(.resources.disk_least_available) B; largest process " +
                  "\(.resources.largest_process_max_rss) B; cgroup memory peak " +
                  "\(.resources.cgroup_memory_peak) B",
                (.guard // empty | .rules | to_entries[] | "- Guard rule `\(.key)`: \(.value // "holds")"),
                "",
                "Units that are not VERIFIED:",
                "",
                (.units | to_entries[] | select(.value.status != "VERIFIED")
                  | "- `\(.key)`: \(.value.status)"),
                "",
                "Failures:",
                "",
                (if .failures == [] then "- none" else
                  .failures[] | "- \(.status): \(.message | .[0:500])" end)
              ' "$receipt"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#receipts[@]}" = 0 ] && [[ "$GATE_OUTCOME" =~ ^(success|failure)$ ]]; then
            echo "the gate step ran and left no receipt" >&2
            exit 1
          fi

      # The summary file, and the logs of the run packed into one archive,
      # which the job uploads in place of the logs.
      - name: Write the summary file and compress the logs
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p artifacts/formal
          logs=(artifacts/formal/runs/*/logs)
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          {
            echo "## formal run: qualification"
            echo
            for receipt in artifacts/formal/runs/*/receipt.json; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, complete \(.complete), \(.seconds) s, part \(.shard // "none")",
                "- Phases: " + ([.phases | to_entries[] | "\(.key) \(.value.seconds) s"] | join(", ")),
                "- Units: " + ([.units[].status] | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                "- Resources: disk available at the start \(.resources.disk_available_at_start) B, " +
                  "least \(.resources.disk_least_available) B; largest process " +
                  "\(.resources.largest_process_max_rss) B; cgroup memory peak " +
                  "\(.resources.cgroup_memory_peak) B",
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
          } > artifacts/formal/summary.md

      - name: Upload the receipt and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-part-qualification-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/job.txt
            artifacts/formal/event.json
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # The shard of each formal target of the head's registry, beside the
  # qualification job: `cargo xtask formal run --shard target/<name>` in a
  # container of the image, prepared as the qualification job is, with a
  # shorter probe and without the event, with the limits that the job
  # `formal limits` gives the shard, which the job writes in a notice for
  # the record of the run. Its main command runs under `deadline.sh`, which
  # passes a cancellation on to it. Without a formal target in the registry
  # the job does not run. The calibration workflow runs the same steps on
  # the calibration target.
  shard:
    name: formal shard ${{ matrix.name }}
    needs: limits
    if: ${{ !cancelled() && needs.limits.result == 'success' && needs.limits.outputs.shards != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.job }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.limits.outputs.shards) }}
    env:
      NAME: ${{ matrix.name }}
      LIMIT: ${{ matrix.job }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          echo "::notice title=timeout-minutes::$LIMIT"
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, shard target/$NAME"
            echo "user: $(id)"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            if [ "$(id -u)" = 0 ] || [ "$(stat -c %u "$GITHUB_WORKSPACE")" != "$(id -u)" ]; then
              echo "the runner's user is root or does not own the checkout" >&2
              exit 1
            fi
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
            df -B1 /
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
          } 2>&1 | tee -a artifacts/formal/job.txt

      # The probe of the job `formal scoped`.
      - name: Probe the container of the gate
        id: probe
        timeout-minutes: 1
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          docker run --rm -i "${gate_flags[@]}" --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --workdir "$GITHUB_WORKSPACE" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          [ "$(id -u)" != 0 ] || { echo "FAILED: the container runs as root"; exit 1; }
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || { echo "FAILED: capabilities"; exit 1; }
          [ "$(ls /sys/class/net)" = lo ] || { echo "FAILED: the container has a network"; exit 1; }
          "$PWD/xtask/target/debug/xtask" help > /dev/null
          echo "the probe passed"
          PROBE

      # The step ends two minutes after the deadline of the shard and its
      # receipt, from the matrix; `deadline.sh` stops the command at that
      # deadline and kills it a minute later.
      - name: Run the shard in the image
        id: shard
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          limit=$(( (STEP - 2) * 60 ))s
          exec bash .github/scripts/deadline.sh --stop-commands "$limit" 1m \
            docker run --rm --name "formal-shard-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env KREPI_FORMAL_TRIGGER \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --shard "target/$NAME"

      - name: Remove the container of the gate
        if: always()
        run: |
          docker rm --force "formal-shard-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

      - name: Summarize the receipt and compress the logs
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.shard.outcome }}
        run: |
          shopt -s nullglob
          # The receipts hold text of Lean and Lake: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          mkdir -p artifacts/formal
          logs=(artifacts/formal/runs/*/logs)
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          receipts=(artifacts/formal/runs/*/receipt.json)
          {
            echo "## formal shard $NAME"
            echo
            echo "Image \`$IMAGE\`; the shard step: $GATE_OUTCOME."
            echo
            for receipt in "${receipts[@]}"; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, complete \(.complete), \(.seconds) s",
                "- Phases: " + ([.phases | to_entries[] | "\(.key) \(.value.seconds) s"] | join(", ")),
                "- Units: " + ([.units[].status] | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                (.proof_targets | to_entries[] | "- Target `\(.key)`: budget \(.value.budget_seconds) s, \(.value.seconds) s"),
                "- Resources: disk available at the start \(.resources.disk_available_at_start) B, " +
                  "least \(.resources.disk_least_available) B; largest process " +
                  "\(.resources.largest_process_max_rss) B; cgroup memory peak " +
                  "\(.resources.cgroup_memory_peak) B",
                (.units | to_entries[] | select(.value.status != "VERIFIED") | "- `\(.key)`: \(.value.status)"),
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
          } | tee artifacts/formal/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#receipts[@]}" = 0 ] && [[ "$GATE_OUTCOME" =~ ^(success|failure)$ ]]; then
            echo "the shard step ran and left no receipt" >&2
            exit 1
          fi

      - name: Upload the receipt, the summary and the logs of the shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-part-target-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/job.txt
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # Merges the receipts of the parts of this run on the runner, without the
  # image: it downloads the artifacts of the job `formal run` and of each
  # shard, of any attempt of the run, and runs `cargo xtask formal merge`
  # under `deadline.sh`. It runs when the gate ran, unless the run was
  # cancelled, also when a part failed or did not run, so that a missing
  # part fails the merge; the jobs of the verdicts take the name of the
  # artifact of its record from its output. Its first step records the start
  # of the job for the synthetic wall clock, and the record of the job gets
  # the disk and memory before the download and after the merge. The
  # calibration workflow runs the same steps on the parts of the
  # calibration target.
  parts:
    name: formal parts
    needs: [gate, shard]
    if: ${{ !cancelled() && needs.gate.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      record: formal-merge-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
    steps:
      # The start of the runner's worker process, else that of this step.
      - name: Record the start of the job
        timeout-minutes: 1
        run: |
          start=$(date +%s)
          if worker=$(ps -o etimes= -C Runner.Worker | sort -n | tail -n 1 | tr -d ' ') \
              && [ -n "$worker" ]; then
            start=$(( start - worker ))
          fi
          echo "KREPI_FORMAL_MERGE_STARTED=$start" | tee -a "$GITHUB_ENV"

      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build xtask
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/formal
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
            echo "== before the download $(date -u +%FT%TZ)"
            df -B1 /
            free -b
          } 2>&1 | tee artifacts/formal/job.txt

      # A single artifact goes to the path itself; of several, each goes to a
      # directory of its own, named after it.
      - name: Download the parts of the run
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: formal-part-*-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: artifacts/formal/parts

      # Every receipt of the parts, however the artifacts are laid out; the
      # record of the job gets that of `/usr/bin/time -v`, where the runner
      # has it. With `time` in front, a SIGTERM, at the deadline or from the
      # runner on a cancellation, can end the step before the command has
      # ended, and no SIGKILL follows.
      - name: Merge the receipts of the parts
        id: merge
        timeout-minutes: 3
        run: |
          receipts=()
          while IFS= read -r -d '' receipt; do
            receipts+=("$receipt")
          done < <(find artifacts/formal/parts -name receipt.json -print0 | sort -z)
          if [ "${#receipts[@]}" = 0 ]; then
            echo "no part of this run left a receipt" >&2
            exit 1
          fi
          timer=()
          if [ -x /usr/bin/time ]; then
            timer=(/usr/bin/time -v -a -o artifacts/formal/job.txt)
          else
            echo "no /usr/bin/time on the runner" >> artifacts/formal/job.txt
          fi
          exec bash .github/scripts/deadline.sh --stop-commands 2m 30s "${timer[@]}" \
            xtask/target/debug/xtask formal merge "${receipts[@]}"

      - name: Summarize the merge
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          mkdir -p artifacts/formal
          { echo "== after the merge $(date -u +%FT%TZ)"; df -B1 /; free -b; } >> artifacts/formal/job.txt
          # The record holds text of the receipts: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          record=artifacts/formal/merge/record.json
          {
            echo "## formal merge"
            echo
            echo "The merge step: $MERGE_OUTCOME."
            echo
            if [ -f "$record" ]; then
              cat artifacts/formal/merge/summary.md
              jq -r '(.parts[] | "- Part `\(.shard // "none")`, attempt \(.attempt // "none")" +
                  "\(if .superseded then ", superseded" else "" end): \(.status // "unread"), " +
                  "\(.seconds) s, SHA-256 `\(.sha256 // "none")`"),
                "- Merge: \(.merge_seconds) s from the \(.merge_from)"' "$record"
            else
              echo "The merge left no record."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the merge record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-merge-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/job.txt
            artifacts/formal/merge/record.json
            artifacts/formal/merge/summary.md
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # Runs each planned target that the pull request affects alone, beside
  # the qualification job: `cargo xtask formal run --target <name>`, which
  # runs only the part of the target and concludes it as `SCOPED`, in a
  # container of the image with the steps of the shard job and the limits
  # that the job `formal limits` gives it, which the job writes in a notice
  # for the record of the run. Its receipt is no part of the merge and the
  # job is no check of the gate. Without an affected planned target the job
  # does not run.
  scoped:
    name: formal scoped ${{ matrix.name }}
    needs: limits
    if: ${{ !cancelled() && needs.limits.result == 'success' && needs.limits.outputs.scoped != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.job }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.limits.outputs.scoped) }}
    env:
      NAME: ${{ matrix.name }}
      LIMIT: ${{ matrix.job }}
    steps:
      - name: Check out the candidate commit
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the runner and pull the image
        timeout-minutes: 8
        run: |
          echo "::notice title=timeout-minutes::$LIMIT"
          mkdir -p artifacts/formal
          {
            echo "== prepare started $(date -u +%FT%TZ)"
            echo "commit $HEAD_SHA, event $GITHUB_EVENT_NAME, ref $GITHUB_REF," \
              "run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, planned target $NAME"
            echo "user: $(id)"
            echo "processors: $(nproc)"
            free -b
            df -B1 /
            if [ "$(id -u)" = 0 ] || [ "$(stat -c %u "$GITHUB_WORKSPACE")" != "$(id -u)" ]; then
              echo "the runner's user is root or does not own the checkout" >&2
              exit 1
            fi
            echo "== docker pull $IMAGE"
            docker pull "$IMAGE"
            docker image inspect --format 'pulled {{json .RepoDigests}}, {{.Size}} bytes' "$IMAGE"
            df -B1 /
          } 2>&1 | tee artifacts/formal/job.txt

      - name: Build xtask
        timeout-minutes: 3
        run: |
          {
            echo "== build xtask, started $(date -u +%FT%TZ)"
            rustup toolchain install
            cargo build --locked --manifest-path xtask/Cargo.toml
          } 2>&1 | tee -a artifacts/formal/job.txt

      # The same probe as that of the job `formal run`, shorter: a user other
      # than root, a read-only root file system, no capabilities and no
      # network.
      - name: Probe the container of the gate
        id: probe
        timeout-minutes: 1
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          docker run --rm -i "${gate_flags[@]}" --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --workdir "$GITHUB_WORKSPACE" \
            "$IMAGE" bash -s 2>&1 <<'PROBE' | tee -a artifacts/formal/job.txt
          [ "$(id -u)" != 0 ] || { echo "FAILED: the container runs as root"; exit 1; }
          grep -q '^CapBnd:[[:space:]]*0*$' /proc/self/status || { echo "FAILED: capabilities"; exit 1; }
          [ "$(ls /sys/class/net)" = lo ] || { echo "FAILED: the container has a network"; exit 1; }
          "$PWD/xtask/target/debug/xtask" help > /dev/null
          echo "the probe passed"
          PROBE

      # The step ends two minutes after the deadline of the target and its
      # receipt, from the matrix; `deadline.sh` stops the command at that
      # deadline and kills it a minute later. The run of a named target is
      # SCOPED whatever its trigger, so it is given none.
      - name: Run the planned target in the image
        id: scoped
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        timeout-minutes: ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: |
          read -r -a gate_flags <<< "$GATE_FLAGS"
          limit=$(( (STEP - 2) * 60 ))s
          exec bash .github/scripts/deadline.sh --stop-commands "$limit" 1m \
            docker run --rm --name "formal-scoped-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${gate_flags[@]}" \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_REF --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env KREPI_FORMAL_IMAGE="$IMAGE" \
            "$IMAGE" "$GITHUB_WORKSPACE/xtask/target/debug/xtask" formal run --target "$NAME"

      - name: Remove the container of the gate
        if: always()
        run: |
          docker rm --force "formal-scoped-$NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

      - name: Summarize the receipt and compress the logs
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.scoped.outcome }}
        run: |
          shopt -s nullglob
          # The receipts hold text of Lean and Lake: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          mkdir -p artifacts/formal
          logs=(artifacts/formal/runs/*/logs)
          if [ "${#logs[@]}" -gt 0 ]; then
            tar -czf artifacts/formal/logs.tar.gz "${logs[@]}"
          fi
          receipts=(artifacts/formal/runs/*/receipt.json)
          {
            echo "## formal scoped $NAME"
            echo
            echo "Image \`$IMAGE\`; the step of the target: $GATE_OUTCOME."
            echo
            for receipt in "${receipts[@]}"; do
              jq -r --arg path "$receipt" --arg sha "$(sha256sum "$receipt" | cut -d ' ' -f 1)" '
                "- Receipt `\($path)`, SHA-256 `\($sha)`: `\(.status)`, complete \(.complete), \(.seconds) s",
                (.proof_targets | to_entries[] | "- Target `\(.key)`: budget \(.value.budget_seconds) s, \(.value.seconds) s"),
                (.units | to_entries[] | "- `\(.key)`: \(.value.status)"),
                (.failures[] | "- \(.status): \(.message | .[0:500])")
              ' "$receipt"
            done
          } | tee artifacts/formal/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#receipts[@]}" = 0 ] && [[ "$GATE_OUTCOME" =~ ^(success|failure)$ ]]; then
            echo "the step of the target ran and left no receipt" >&2
            exit 1
          fi

      - name: Upload the receipt, the summary and the logs of the planned target
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-scoped-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/formal/summary.md
            artifacts/formal/logs.tar.gz
            artifacts/formal/job.txt
            artifacts/formal/runs/*/receipt.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # On every event of a pull request, lists the paths that it changes since
  # its merge base, whether they affect the gate and the registered targets
  # that they affect, with `cargo xtask formal impact` on the runner, and
  # writes the list into the summary of the run. Its outputs give the
  # decision, the planned targets that the change affects, for the job
  # `formal limits`, and the name of the artifact of the list, for the jobs
  # of the verdicts. It judges nothing: it fails only when the list cannot
  # be made, on any other event than a pull request, which it does not
  # judge, and on a re-run of an older run. Its main command runs under
  # `deadline.sh`, which turns workflow commands off while it prints the
  # paths of the pull request, and the summary escapes carriage returns and
  # indents the list as code.
  fast:
    name: formal fast
    if: ${{ !cancelled() && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      scoped: ${{ steps.decision.outputs.scoped }}
      impact: formal-impact-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Check that the event is a pull request
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "the job judges pull requests, not a run of $GITHUB_EVENT_NAME on $GITHUB_REF" >&2
            exit 1
          fi
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi

      - name: Check out the head with its history
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build xtask on the runner
        timeout-minutes: 3
        run: |
          rustup toolchain install
          cargo build --locked --manifest-path xtask/Cargo.toml

      - name: List the changed paths and the affected targets
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts/formal
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -o pipefail -c \
            'xtask/target/debug/xtask formal impact --base "$BASE_SHA" 2>&1 | tee artifacts/formal/impact.txt'

      # The decision, `affected` or `unaffected`, and the planned targets that
      # the change affects, by names that the registry allows, as JSON.
      - name: Write the decision and the planned targets
        id: decision
        if: always()
        timeout-minutes: 1
        run: |
          lines=$(cat artifacts/formal/impact.txt 2> /dev/null || true)
          decision=$(sed -n -E 's/^decision (affected|unaffected)$/\1/p' <<< "$lines")
          scoped=$(sed -n -E 's/^target ([a-z0-9][a-z0-9-]*) planned$/\1/p' <<< "$lines" \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          {
            echo "decision=$decision"
            echo "scoped=$scoped"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Summarize the paths and the targets
        if: always()
        run: |
          {
            echo "## formal fast"
            echo
            if [ -f artifacts/formal/impact.txt ]; then
              sed 's/\r/\\r/g; s/^/    /' artifacts/formal/impact.txt
            else
              echo "The list was not made."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the list of the changed paths
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-impact-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/formal/impact.txt
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  # On every event of a pull request, `cargo xtask formal guard` on the
  # runner, with the event of the run: it checks the pull request against
  # the rules for changes of statements, proofs, sources and registries, and
  # its failure fails the job; it fails as well on any other event than a
  # pull request, which it does not judge, and on a re-run of an older run.
  # Its main command runs under `deadline.sh`, which turns workflow commands
  # off while it prints, and the summary escapes carriage returns and
  # indents its output as code.
  guard:
    name: formal guard
    if: ${{ !cancelled() && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check that the event is a pull request
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "the job judges pull requests, not a run of $GITHUB_EVENT_NAME on $GITHUB_REF" >&2
            exit 1
          fi
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi

      - name: Check out the head with its history
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build xtask on the runner
        timeout-minutes: 3
        run: |
          rustup toolchain install
          cargo build --locked --manifest-path xtask/Cargo.toml

      - name: Check the pull request with formal guard
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/formal
          cp "$GITHUB_EVENT_PATH" artifacts/formal/event.json
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -o pipefail -c \
            'xtask/target/debug/xtask formal guard --event artifacts/formal/event.json 2>&1 | tee artifacts/formal/guard.txt'

      - name: Summarize the guard
        if: always()
        run: |
          {
            echo "## formal guard"
            echo
            if [ -f artifacts/formal/guard.txt ]; then
              sed 's/\r/\\r/g; s/^/    /' artifacts/formal/guard.txt
            else
              echo "The guard did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The verdict of the gate on the event of the run, from the record of the
  # job `formal parts`. Its first step judges the event, with the same text
  # as the other three verdicts. On a pull request, a change that does not
  # affect the gate, by the decision of `formal fast`, passes, with the
  # paths that it changes in the summary; one that affects the gate needs
  # the event that runs the gate, the label full-check added, and a record
  # of `formal parts`. A manual or scheduled run of main runs the gate
  # whatever the decision, which the job then makes on the commit itself
  # and writes to the summary. Any other event or ref fails it, and so does
  # a re-run of an older run of a pull request. The record
  # must be of schema 3, of this run, commit and trigger, and pass; on main
  # the job then reads it back as a fresh record with `cargo xtask formal
  # receipt --require-fresh`, which changes no verdict.
  merge:
    name: formal merge
    needs: [fast, parts]
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Judge the event
        id: event
        timeout-minutes: 1
        env:
          FAST: ${{ needs.fast.result }}
          DECISION: ${{ needs.fast.outputs.decision }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PARTS: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$FAST" != success ]; then
                echo "formal fast did not succeed: $FAST" >&2
                exit 1
              fi
              case "$DECISION" in
                unaffected) gate=unaffected ;;
                affected)
                  if [ "$ACTION" != labeled ] || [ "$LABEL" != full-check ]; then
                    echo "the change affects the gate, which did not run on this event" >&2
                    exit 1
                  fi
                  gate=ran
                  ;;
                *)
                  echo "formal fast made no decision" >&2
                  exit 1
                  ;;
              esac
              ;;
            schedule | workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "the gate runs on a run of $GITHUB_EVENT_NAME of main only" >&2
                exit 1
              fi
              gate=ran
              ;;
            *)
              echo "no verdict of the gate on a run of $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$gate" = ran ] && [ "$PARTS" != success ] && [ "$PARTS" != failure ]; then
            echo "formal parts did not run to its end: $PARTS" >&2
            exit 1
          fi
          echo "gate=$gate" | tee -a "$GITHUB_OUTPUT"

      - name: Check out the commit
        if: steps.event.outputs.gate == 'ran' && github.event_name != 'pull_request'
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build xtask on the runner
        if: steps.event.outputs.gate == 'ran' && github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          rustup toolchain install
          cargo build --locked --manifest-path xtask/Cargo.toml

      - name: Decide on the commit itself
        if: steps.event.outputs.gate == 'ran' && github.event_name != 'pull_request'
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/formal
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -o pipefail -c \
            'xtask/target/debug/xtask formal impact --base "$GITHUB_SHA" 2>&1 | tee artifacts/formal/impact.txt'

      - name: Summarize the decision on the commit itself
        if: ${{ always() && steps.event.outputs.gate == 'ran' && github.event_name != 'pull_request' }}
        timeout-minutes: 1
        run: |
          {
            echo "## formal merge: the decision on the commit itself"
            echo
            echo "A run of $GITHUB_EVENT_NAME runs the gate whatever the decision."
            echo
            if [ -f artifacts/formal/impact.txt ]; then
              sed 's/\r/\\r/g; s/^/    /' artifacts/formal/impact.txt
            else
              echo "The decision was not made."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the list of the changed paths
        if: steps.event.outputs.gate == 'unaffected'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.fast.outputs.impact }}
          path: artifacts/formal/impact

      - name: Summarize the changed paths
        if: steps.event.outputs.gate == 'unaffected'
        timeout-minutes: 1
        run: |
          {
            echo "## formal merge"
            echo
            echo "The change does not affect the gate; the paths that it changes:"
            echo
            sed 's/\r/\\r/g; s/^/    /' artifacts/formal/impact/impact.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the merge record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.parts.outputs.record }}
          path: artifacts/formal/verdict

      - name: Judge the record
        id: record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 1
        run: |
          record=$(find artifacts/formal/verdict -name record.json -print -quit)
          if [ -z "$record" ]; then
            echo "the artifact of formal parts holds no record" >&2
            exit 1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$HEAD_SHA" --arg mode "$KREPI_FORMAL_TRIGGER" \
            '.schema == 3 and .run_id == $run and .commit == $sha and .trigger == $mode and .passes' "$record"

      - name: Summarize the record
        if: ${{ always() && steps.record.outputs.record != '' }}
        timeout-minutes: 1
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          # The record holds text of the receipts: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          {
            echo "## formal merge"
            echo
            cat "$(dirname "$RECORD")/summary.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The line `formal receipt: CURRENT and fresh` in the log of this step
      # is the evidence of a fresh record of main.
      - name: Read the record back as a fresh one
        if: steps.event.outputs.gate == 'ran' && github.event_name != 'pull_request'
        timeout-minutes: 2
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -c \
            'xtask/target/debug/xtask formal receipt --require-fresh "$1" || true' readback "$RECORD"

  # The verdict of the hard gate of the axiom audits, on the events and with
  # the first step of `formal merge`: the field `gates.axioms` of the same
  # record. Its summary reports the axioms of each audited theorem, and each
  # target of a waiver, whose proof modules that no other formal target
  # lists the base audit leaves out and its shard audits when its proofs
  # build.
  axioms:
    name: formal axioms
    needs: [fast, parts]
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Judge the event
        id: event
        timeout-minutes: 1
        env:
          FAST: ${{ needs.fast.result }}
          DECISION: ${{ needs.fast.outputs.decision }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PARTS: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$FAST" != success ]; then
                echo "formal fast did not succeed: $FAST" >&2
                exit 1
              fi
              case "$DECISION" in
                unaffected) gate=unaffected ;;
                affected)
                  if [ "$ACTION" != labeled ] || [ "$LABEL" != full-check ]; then
                    echo "the change affects the gate, which did not run on this event" >&2
                    exit 1
                  fi
                  gate=ran
                  ;;
                *)
                  echo "formal fast made no decision" >&2
                  exit 1
                  ;;
              esac
              ;;
            schedule | workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "the gate runs on a run of $GITHUB_EVENT_NAME of main only" >&2
                exit 1
              fi
              gate=ran
              ;;
            *)
              echo "no verdict of the gate on a run of $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$gate" = ran ] && [ "$PARTS" != success ] && [ "$PARTS" != failure ]; then
            echo "formal parts did not run to its end: $PARTS" >&2
            exit 1
          fi
          echo "gate=$gate" | tee -a "$GITHUB_OUTPUT"

      - name: Write that the change does not affect the gate
        if: steps.event.outputs.gate == 'unaffected'
        timeout-minutes: 1
        run: |
          echo "unaffected: the change does not affect the gate" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the merge record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.parts.outputs.record }}
          path: artifacts/formal/verdict

      - name: Judge the record
        id: record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 1
        run: |
          record=$(find artifacts/formal/verdict -name record.json -print -quit)
          if [ -z "$record" ]; then
            echo "the artifact of formal parts holds no record" >&2
            exit 1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$HEAD_SHA" --arg mode "$KREPI_FORMAL_TRIGGER" \
            '.schema == 3 and .run_id == $run and .commit == $sha and .trigger == $mode and .gates.axioms == true' "$record"

      - name: Report the axioms of the audited theorems
        if: ${{ always() && steps.record.outputs.record != '' }}
        timeout-minutes: 1
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          # The record holds names of the head: no workflow commands, and each
          # name as a JSON string with its backticks escaped.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          {
            echo "## formal axioms"
            echo
            jq -r 'def name: "`" + (@json | gsub("`"; "\\u0060")) + "`";
              "- the hard gate: \(if .gates.axioms then "passes" else "fails" end)",
              (if .axioms == {} then "- no audited theorem" else
                (.axioms | to_entries[] | "- \(.key | name): \(.value | map(name) | join(", "))") end),
              (.waivers[] | .waiver.scope[] | "- target \(name): a waiver leaves its proof modules that no " +
                "other formal target lists out of the base audit; its shard audits them when its proofs build")' \
              "$RECORD"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The verdict of the hard gate of the replay of the stage with
  # `leanchecker --fresh`, on the events and with the first step of
  # `formal merge`: the field `gates.leanchecker` of the same record.
  leanchecker:
    name: formal leanchecker
    needs: [fast, parts]
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Judge the event
        id: event
        timeout-minutes: 1
        env:
          FAST: ${{ needs.fast.result }}
          DECISION: ${{ needs.fast.outputs.decision }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PARTS: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$FAST" != success ]; then
                echo "formal fast did not succeed: $FAST" >&2
                exit 1
              fi
