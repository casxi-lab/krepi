                    echo "the change affects the gate, which did not run on this event" >&2
                    exit 1
                  fi
                  gate=ran
                  ;;
                *)
                  echo "formal fast made no decision" >&2
                  exit 1
                  ;;
              esac
              ;;
            schedule | workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "the gate runs on a run of $GITHUB_EVENT_NAME of main only" >&2
                exit 1
              fi
              gate=ran
              ;;
            *)
              echo "no verdict of the gate on a run of $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$gate" = ran ] && [ "$PARTS" != success ] && [ "$PARTS" != failure ]; then
            echo "formal parts did not run to its end: $PARTS" >&2
            exit 1
          fi
          echo "gate=$gate" | tee -a "$GITHUB_OUTPUT"

      - name: Write that the change does not affect the gate
        if: steps.event.outputs.gate == 'unaffected'
        timeout-minutes: 1
        run: |
          echo "unaffected: the change does not affect the gate" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the merge record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.parts.outputs.record }}
          path: artifacts/formal/verdict

      - name: Judge the record
        id: record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 1
        run: |
          record=$(find artifacts/formal/verdict -name record.json -print -quit)
          if [ -z "$record" ]; then
            echo "the artifact of formal parts holds no record" >&2
            exit 1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$HEAD_SHA" --arg mode "$KREPI_FORMAL_TRIGGER" \
            '.schema == 3 and .run_id == $run and .commit == $sha and .trigger == $mode and .gates.leanchecker == true' "$record"

      - name: Summarize the hard gate
        if: ${{ always() && steps.record.outputs.record != '' }}
        timeout-minutes: 1
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          {
            echo "## formal leanchecker"
            echo
            jq -r '"- the hard gate: \(if .gates.leanchecker then "passes" else "fails" end)"' "$RECORD"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The verdict of the hard gate of the comparator, on the events and with
  # the first step of `formal merge`: the field `gates.comparator` of the
  # same record. Its summary gives the conclusion of each unit of the
  # comparator, or that there is no proved statement.
  comparator:
    name: formal comparator
    needs: [fast, parts]
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Judge the event
        id: event
        timeout-minutes: 1
        env:
          FAST: ${{ needs.fast.result }}
          DECISION: ${{ needs.fast.outputs.decision }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PARTS: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run judges the event of its run again, which only the newest
          # run of formal on a pull request with the head may do.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/formal.yml/runs"
            newest=$(gh api "$runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id')
            if [ "$newest" != "$GITHUB_RUN_ID" ]; then
              echo "a re-run of run $GITHUB_RUN_ID judges an older event than run $newest of the head" >&2
              exit 1
            fi
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$FAST" != success ]; then
                echo "formal fast did not succeed: $FAST" >&2
                exit 1
              fi
              case "$DECISION" in
                unaffected) gate=unaffected ;;
                affected)
                  if [ "$ACTION" != labeled ] || [ "$LABEL" != full-check ]; then
                    echo "the change affects the gate, which did not run on this event" >&2
                    exit 1
                  fi
                  gate=ran
                  ;;
                *)
                  echo "formal fast made no decision" >&2
                  exit 1
                  ;;
              esac
              ;;
            schedule | workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "the gate runs on a run of $GITHUB_EVENT_NAME of main only" >&2
                exit 1
              fi
              gate=ran
              ;;
            *)
              echo "no verdict of the gate on a run of $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$gate" = ran ] && [ "$PARTS" != success ] && [ "$PARTS" != failure ]; then
            echo "formal parts did not run to its end: $PARTS" >&2
            exit 1
          fi
          echo "gate=$gate" | tee -a "$GITHUB_OUTPUT"

      - name: Write that the change does not affect the gate
        if: steps.event.outputs.gate == 'unaffected'
        timeout-minutes: 1
        run: |
          echo "unaffected: the change does not affect the gate" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the merge record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.parts.outputs.record }}
          path: artifacts/formal/verdict

      - name: Judge the record
        id: record
        if: steps.event.outputs.gate == 'ran'
        timeout-minutes: 1
        run: |
          record=$(find artifacts/formal/verdict -name record.json -print -quit)
          if [ -z "$record" ]; then
            echo "the artifact of formal parts holds no record" >&2
            exit 1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$HEAD_SHA" --arg mode "$KREPI_FORMAL_TRIGGER" \
            '.schema == 3 and .run_id == $run and .commit == $sha and .trigger == $mode and .gates.comparator == true' "$record"

      - name: Summarize the units of the comparator
        if: ${{ always() && steps.record.outputs.record != '' }}
        timeout-minutes: 1
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          # The record holds names of the head: no workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          {
            echo "## formal comparator"
            echo
            jq -r '"- the hard gate: \(if .gates.comparator then "passes" else "fails" end)",
              ([.units | to_entries[] | select(.key == "comparator" or (.key | startswith("comparator/")))]
                | if . == [] then "- no proved statement" else .[] | "- `\(.key)`: \(.value.status)" end)' \
              "$RECORD"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # On a push to main, the merge of a pull request: reviews the merge record
  # of the merged head, the second parent of the merge, whose tree the merge
  # must keep. A change that does not affect the gate, by the decision of
  # `cargo xtask formal impact` against the first parent, passes, which is
  # no evidence that the record is CURRENT. Otherwise the job takes the
  # latest run of this workflow on a pull request with that head in which
  # `formal run` concluded and `formal merge` succeeded, downloads the merge
  # record of its latest attempt and judges it with `cargo xtask formal
  # receipt`: CURRENT passes, and WAIVED passes when the waivers that it
  # used hold on the day of the review; anything else fails.
  review:
    name: formal receipt review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the merge with its history
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build xtask on the runner
        timeout-minutes: 3
        run: |
          rustup toolchain install
          cargo build --locked --manifest-path xtask/Cargo.toml

      - name: Decide on the merged head
        timeout-minutes: 2
        run: |
          if ! head=$(git rev-parse --verify --quiet 'HEAD^2'); then
            echo "$GITHUB_SHA has no second parent: it is no merge of a pull request" >&2
            exit 1
          fi
          if ! git diff --quiet "$head" HEAD; then
            echo "the merge changed the tree of the head $head" >&2
            exit 1
          fi
          echo "MERGED_HEAD=$head" | tee -a "$GITHUB_ENV"
          mkdir -p artifacts/formal
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -o pipefail -c \
            'xtask/target/debug/xtask formal impact --base HEAD^1 2>&1 | tee artifacts/formal/impact.txt'

      - name: Review the receipt of the merged head
        timeout-minutes: 5
        run: |
          case "$(sed -n 's/^decision //p' artifacts/formal/impact.txt)" in
            unaffected)
              echo "unaffected: not evidence of CURRENT" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            affected) ;;
            *)
              echo "formal impact made no decision" >&2
              exit 1
              ;;
          esac
          # The runs of a pull request with the head, the newest first.
          api=repos/$GITHUB_REPOSITORY/actions
          runs=$(gh api --paginate "$api/workflows/formal.yml/runs?event=pull_request&head_sha=$MERGED_HEAD&per_page=100" \
            --jq '.workflow_runs[].id')
          run=
          for id in $runs; do
            verdicts=$(gh api "$api/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "formal run" or .name == "formal merge") | "\(.name)=\(.conclusion)"] | sort | join(" ")')
            case "$verdicts" in
              "formal merge=success formal run=success" | "formal merge=success formal run=failure")
                run=$id
                break
                ;;
            esac
          done
          if [ -z "$run" ]; then
            echo "no run of a pull request with the head $MERGED_HEAD ran the gate and passed formal merge" >&2
            exit 1
          fi
          name=$(gh api --paginate "$api/runs/$run/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | .name | select(startswith(\"formal-merge-$MERGED_HEAD-\"))" \
            | sort -t - -k 4,4 -n | tail -n 1)
          if [ -z "$name" ]; then
            echo "the run $run has no merge record of the head $MERGED_HEAD" >&2
            exit 1
          fi
          echo "run $run, artifact $name" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download -R "$GITHUB_REPOSITORY" "$run" -n "$name" -D artifacts/formal/review
          record=$(find artifacts/formal/review -name record.json -print -quit)
          if [ -z "$record" ]; then
            echo "the artifact $name holds no record" >&2
            exit 1
          fi
          # The verdict: 0 is CURRENT and 3 WAIVED, whose waivers hold today.
          exec bash .github/scripts/deadline.sh --stop-commands 1m 30s bash -c \
            'xtask/target/debug/xtask formal receipt "$1" | tee -a "$GITHUB_STEP_SUMMARY"; s=${PIPESTATUS[0]}; [ "$s" = 0 ] || [ "$s" = 3 ]' \
            review "$record"
