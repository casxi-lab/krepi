# The full line, on the head of a pull request to main that has been
# reviewed and is next to be merged. It runs only when the label full-check
# is added to the pull request, never on a push to it, so a new head needs
# the label to be removed and added again. The first job requires the head
# to contain the main of that moment, so that the merge commit has the tree
# of the head that was checked; then the host checks with the slow tests,
# and every QEMU suite with its slow cases on the images taken by their
# digests, run on the head. Each job has a limit, and the check, the image
# command and the suite command also stop at a deadline one or two minutes
# before the limit of their job, counting for the check the limit of the
# pull of the proof-tool image before it; the script that sets the deadline
# passes a stop signal of the runner on to the command and waits for it.
# Actions are pinned to full commit SHAs; the comment names the release.
name: full

on:
  pull_request:
    branches: [main]
    types: [labeled]

# A label other than full-check starts a run whose jobs are all skipped; it
# does not cancel a run of the full line.
concurrency:
  group: full-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

# The jobs restore the caches that the workflow cache saves from main, and
# save none.
cache-mode: read

# `bash` runs every step with `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  head:
    name: full head contains main
    if: github.event.label.name == 'full-check'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out the head with the history of every branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the head to contain main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          main=$(git rev-parse refs/remotes/origin/main)
          echo "main is $main; the head is $HEAD_SHA"
          if ! git merge-base --is-ancestor "$main" "$HEAD_SHA"; then
            echo "the head does not contain main $main: merge main into the branch," \
              "then remove the label full-check and add it again" >&2
            exit 1
          fi
          echo "## full head contains main" >> "$GITHUB_STEP_SUMMARY"
          echo "The head $HEAD_SHA contains main $main." >> "$GITHUB_STEP_SUMMARY"

  check:
    name: full cargo xtask check --slow
    needs: head
    if: github.event.label.name == 'full-check'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 42
    permissions:
      contents: read
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      # apt, which runs as root, leaves a lock and a partial directory that
      # the runner user cannot read beside the packages; they are removed,
      # so that the tools cache holds the packages alone, owned by the
      # runner user.
      - name: Install Clang and QEMU
        run: |
          mkdir -p ~/.cache/krepi-ci/apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.cache/krepi-ci/apt" \
            -o APT::Keep-Downloaded-Packages=true clang-18 qemu-system-arm
          sudo rm -rf ~/.cache/krepi-ci/apt/partial ~/.cache/krepi-ci/apt/lock
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/krepi-ci/apt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Pull the pinned proof-tool image
        timeout-minutes: 3
        run: docker pull "$(jq -er '"\(.repository)@\(.digest)"' verification/image-pin.json)"

      - name: Run cargo xtask check with the slow tests
        run: exec bash .github/scripts/deadline.sh 38m 90s cargo xtask check --slow --receipt artifacts/check-receipt.json

      - name: Require the formal step to have passed
        run: jq -e '[.steps[] | select(.name == "formal")] | length == 1 and .[0].status == "passed"' artifacts/check-receipt.json

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-check-receipt-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  image:
    name: full image
    needs: head
    if: github.event.label.name == 'full-check'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact: full-images-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
      test-elf-sha256: ${{ steps.image.outputs.test-elf-sha256 }}
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Write the images
        run: exec bash .github/scripts/deadline.sh 3m 60s cargo xtask image --output-dir artifacts/images

      - name: Give the digests of the images as outputs
        id: image
        run: jq -r '.images[] | "\(.name)-sha256=\(.sha256)"' artifacts/images/images.json >> "$GITHUB_OUTPUT"

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-images-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/images
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  suite:
    name: full suite --slow
    needs: image
    if: github.event.label.name == 'full-check'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Restore the CI tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'toolchains.toml') }}
          path: |
            ~/.cache/krepi-ci/apt/
            ~/.rustup/toolchains/1.99.0-aarch64-unknown-linux-gnu/
            ~/.rustup/update-hashes/1.99.0-aarch64-unknown-linux-gnu

      - name: Restore the Cargo registry and build directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'kernel/Cargo.lock', 'user/Cargo.lock', 'xtask/Cargo.lock', 'tools/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            xtask/target/
            tools/target/

      # apt, which runs as root, leaves a lock and a partial directory that
      # the runner user cannot read beside the packages; they are removed,
      # so that the tools cache holds the packages alone, owned by the
      # runner user.
      - name: Install QEMU
        run: |
          mkdir -p ~/.cache/krepi-ci/apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.cache/krepi-ci/apt" \
            -o APT::Keep-Downloaded-Packages=true qemu-system-arm
          sudo rm -rf ~/.cache/krepi-ci/apt/partial ~/.cache/krepi-ci/apt/lock
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/krepi-ci/apt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # The name of the artifact comes from the job that uploaded it, so
      # that a rerun of this job alone still finds it.
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.image.outputs.artifact }}
          path: artifacts/images

      # Workflow commands are off while the suite prints.
      - name: Run every QEMU suite with the slow cases
        env:
          TEST_ELF_SHA256: ${{ needs.image.outputs.test-elf-sha256 }}
        run: |
          exec bash .github/scripts/deadline.sh --stop-commands 23m 60s cargo xtask suite --slow \
            --images artifacts/images --expect "test-elf=$TEST_ELF_SHA256" --output-dir artifacts/suite

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/suite
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
