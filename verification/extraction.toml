# How Charon compiles each crate that `cargo xtask formal run` extracts. The
# gate reads this file from the snapshot and stops a run whose configuration
# it cannot follow; see "Extraction" in docs/formal-verification.md.
schema = 1

# The qualification crate, verification/qualification. Charon is given no
# `--target`, so it compiles the crate for the host and adds the host's
# triple itself: the triples record that choice for each host of the tool
# manifest, and the gate checks that each host has one but not its value.
# Only runs on linux-aarch64 are evidence. The gate passes no features and
# no `cfg` settings, so both lists stay empty.
[qualification]
features = []
cfg = []

[qualification.triples]
linux-aarch64 = "aarch64-unknown-linux-gnu"
darwin-arm64 = "aarch64-apple-darwin"

# The kernel workspace, extracted for the extraction triple: each kernel
# target is extracted from its root package, and the gate passes the triple
# to Cargo with `--target`. The gate passes no features and no `cfg`
# settings, so both lists stay empty. Charon builds the package in the dev
# profile: `debug_assert!` is checked only in what the gate extracts, and
# `cfg!(debug_assertions)` differs between the extraction and the release
# build of the images, which review alone keeps out of the code that is
# proved. No kernel target is registered yet. The triple is a pin of the
# gate, whose standard library the image of the proof tools installs. It
# is not the target of the kernel images,
# aarch64-unknown-none-softfloat, whose soft-float ABI keeps compiled
# kernel code off the FP/SIMD registers at EL1, where FP/SIMD instructions
# trap. The two triples have the same architecture, OS and data layout and
# differ in the floating-point ABI, the target feature `neon` and linker
# arguments; the kernel crates use no floating point and no `cfg` on the
# ABI or on a target feature, so Charon translates the same source for
# both.
[kernel]
triple = "aarch64-unknown-none"
features = []
cfg = []
