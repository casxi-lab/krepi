# The Lake project of the calibration target: its statements and proofs, and
# the definitions that Aeneas generates from its crate. It has the libraries
# of the Lake project of `verification/`, whose `lean-toolchain` and
# `lake-manifest.json` the proof gate writes into each stage of this
# project, with the name of this project in the lock: the two projects pin
# the same Lean and the same packages, and the files are kept once. Like
# that project, it is built only in the stages of a run, where
# `artifacts/formal/lake` lies next to it.
name = "krepiCalibration"
packagesDir = "../artifacts/formal/lake/packages"
defaultTargets = ["Krepi"]

[[require]]
name = "aeneas"
path = "../artifacts/formal/lake/aeneas"

# Hand-written Lean: the statements and the proofs about the crate.
[[lean_lib]]
name = "Krepi"
globs = ["Krepi.+"]

# Definitions generated by Aeneas from the extracted Rust.
[[lean_lib]]
name = "KrepiGen"
globs = ["KrepiGen.+"]

# The root module `Krepi`, which the gate writes in the stages of a run.
[[lean_lib]]
name = "KrepiRoot"
roots = ["Krepi"]
