[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks for krepi, run as `cargo xtask`"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# xtask is a workspace of its own, outside the kernel and user-space
# workspaces.
[workspace]

[dependencies]
# The host tooling crate of this repository, whose serial capture is the
# command `cargo xtask serial-capture`.
krepi-tools = { path = "../tools" }
# The receipt keeps its fields in the order in which they are written, and
# the manifests step reads the output of `cargo metadata`. Both are text in
# memory, so the standard-library support of the default feature is left
# out.
serde_json = { version = "=1.0.154", default-features = false, features = ["preserve_order"] }
# Manifests and Cargo configuration files are parsed into tables, which
# `serde` defines, and never written, so the writer and the standard-library
# support of the default features are left out.
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde"] }
# The workflows step uses the event parser on text that is already UTF-8,
# so the input-decoding support of the default feature is left out.
yaml-rust2 = { version = "=0.13.0", default-features = false }
